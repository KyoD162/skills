name: skill-drift

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the skill matches the server tool surface
        env:
          SERVER_REPO_TOKEN: ${{ secrets.SERVER_REPO_TOKEN }}
        run: python scripts/check_skill_drift.py
